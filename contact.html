<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - WMPKD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Inter', system-ui, sans-serif; } 
  </style>
</head>
<body class="bg-[#f8f1e3] text-gray-900">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="text-3xl font-bold text-orange-600">WMPKD</div>
      <div class="hidden md:flex gap-8 text-lg font-medium">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span id="cart-count" class="bg-orange-600 text-white text-xs px-2 py-0.5 rounded-full">0</span></a>
        <a href="contact.html" class="text-orange-600">Contact</a>
      </div>
    </div>
  </nav>

  <section class="py-16">
    <div class="max-w-6xl mx-auto px-6">
      <h1 class="text-5xl font-bold text-center mb-4">CONTACT US</h1>
      <p class="text-center text-gray-600 text-xl mb-16">We're here to serve you fresh snacks!</p>

      <div class="grid md:grid-cols-2 gap-12">
        <!-- Contact Info -->
        <div class="bg-white p-10 rounded-3xl shadow">
          <h2 class="text-3xl font-semibold mb-8">Get In Touch</h2>
          
          <div class="space-y-8">
            <div class="flex gap-5">
              <div class="w-12 h-12 bg-orange-100 rounded-2xl flex items-center justify-center text-3xl text-orange-600">
                <i class="fas fa-phone"></i>
              </div>
              <div>
                <p class="font-semibold text-lg">Phone / WhatsApp</p>
                <a href="https://wa.me/2349043268478" target="_blank" 
                   class="text-orange-600 hover:underline text-xl">+234 904 326 8478</a>
              </div>
            </div>

            <div class="flex gap-5">
              <div class="w-12 h-12 bg-orange-100 rounded-2xl flex items-center justify-center text-3xl text-orange-600">
                <i class="fas fa-envelope"></i>
              </div>
              <div>
                <p class="font-semibold text-lg">Email</p>
                <p class="text-gray-700">wmpkd.snacks@gmail.com</p>
              </div>
            </div>

            <div class="flex gap-5">
              <div class="w-12 h-12 bg-orange-100 rounded-2xl flex items-center justify-center text-3xl text-orange-600">
                <i class="fas fa-map-marker-alt"></i>
              </div>
              <div>
                <p class="font-semibold text-lg">Location</p>
                <p class="text-gray-700">UNIBEN Campus &amp; Benin City, Edo State</p>
              </div>
            </div>

            <div class="flex gap-5">
              <div class="w-12 h-12 bg-orange-100 rounded-2xl flex items-center justify-center text-3xl text-orange-600">
                <i class="fas fa-clock"></i>
              </div>
              <div>
                <p class="font-semibold text-lg">Business Hours</p>
                <p class="text-gray-700">Monday - Saturday: 8:00 AM - 7:00 PM</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Send Message Form -->
        <div class="bg-white p-10 rounded-3xl shadow">
          <h2 class="text-3xl font-semibold mb-8">Send Us a Message</h2>
          
          <form id="contact-form" class="space-y-6">
            <div class="grid grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-medium mb-2">Your Name</label>
                <input type="text" id="c-name" required
                       class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-orange-500">
              </div>
              <div>
                <label class="block text-sm font-medium mb-2">Phone Number</label>
                <input type="tel" id="c-phone" required
                       class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-orange-500">
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">Email (Optional)</label>
              <input type="email" id="c-email"
                     class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-orange-500">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">Message</label>
              <textarea id="c-message" rows="6" required placeholder="How can we help you today?"
                        class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-orange-500"></textarea>
            </div>

            <button onclick="sendContactMessage(event)" 
                    class="w-full bg-orange-600 hover:bg-orange-700 text-white py-5 rounded-2xl text-lg font-semibold">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
  <script>
    function sendContactMessage(e) {
      e.preventDefault();
      
      const name = document.getElementById('c-name').value;
      const phone = document.getElementById('c-phone').value;
      const email = document.getElementById('c-email').value;
      const message = document.getElementById('c-message').value;

      let text = `*New Message from WMPKD Website*\n\n`;
      text += `👤 Name: ${name}\n`;
      text += `📱 Phone: ${phone}\n`;
      if (email) text += `✉️ Email: ${email}\n`;
      text += `\n💬 Message:\n${message}`;

      const whatsappUrl = `https://wa.me/2349043268478?text=${encodeURIComponent(text)}`;
      window.open(whatsappUrl, '_blank');

      // Reset form
      document.getElementById('contact-form').reset();
      alert("Message sent successfully! We'll reply via WhatsApp.");
    }

    updateCartCount();
  </script>
</body>
</html>
