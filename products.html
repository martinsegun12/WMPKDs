<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Products - WMPKD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-[#f8f1e3]">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="text-3xl font-bold text-orange-600">WMPKD</div>
      <div class="hidden md:flex gap-8 text-lg font-medium">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html" class="text-orange-600">Products</a>
        <a href="cart.html">Cart <span id="cart-count" class="bg-orange-600 text-white text-xs px-2 py-0.5 rounded-full">0</span></a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <section class="py-12">
    <div class="max-w-7xl mx-auto px-6">
      <h1 class="text-4xl font-bold text-center mb-4">OUR SNACKS</h1>
      <div class="flex flex-wrap justify-center gap-3 mb-12">
        <button onclick="filterCategory('all')" class="px-6 py-2 bg-orange-600 text-white rounded-full">All Snacks</button>
        <button onclick="filterCategory('crunchy')" class="px-6 py-2 bg-white border rounded-full">Crunchy</button>
        <button onclick="filterCategory('sweet')" class="px-6 py-2 bg-white border rounded-full">Sweet</button>
        <button onclick="filterCategory('spicy')" class="px-6 py-2 bg-white border rounded-full">Spicy</button>
        <button onclick="filterCategory('pastries')" class="px-6 py-2 bg-white border rounded-full">Pastries</button>
      </div>

      <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
      <div id="no-products" class="hidden text-center py-20 text-gray-500">No products yet. Add some from Admin Panel.</div>
    </div>
  </section>

  <script src="script.js"></script>
  <script>
    async function loadProducts() {
      const snapshot = await db.collection("products").get();
      const products = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
      
      const container = document.getElementById('products-grid');
      if (products.length === 0) {
        document.getElementById('no-products').classList.remove('hidden');
        return;
      }

      container.innerHTML = products.map(p => `
        <div class="bg-white rounded-3xl overflow-hidden shadow hover:shadow-xl transition">
          <img src="${p.imageUrl}" class="w-full h-48 object-cover">
          <div class="p-5">
            <h3 class="font-bold">${p.name}</h3>
            <p class="text-2xl font-semibold text-orange-600">₦${p.price}</p>
            <button onclick='addToCart(${JSON.stringify(p)})' 
                    class="mt-4 w-full bg-orange-600 hover:bg-orange-700 text-white py-3 rounded-2xl">
              Add to Cart
            </button>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      // Simple client-side filter if needed
      loadProducts();
    }

    loadProducts();
    updateCartCount();
  </script>
</body>
</html>
