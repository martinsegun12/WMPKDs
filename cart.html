<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart - WMPKD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Inter', system-ui, sans-serif; } 
  </style>
</head>
<body class="bg-[#f8f1e3] text-gray-900">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="text-3xl font-bold text-orange-600">WMPKD</div>
      <div class="hidden md:flex gap-8 text-lg font-medium">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html">Products</a>
        <a href="cart.html" class="text-orange-600">Cart <span id="cart-count" class="bg-orange-600 text-white text-xs px-2 py-0.5 rounded-full">0</span></a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <section class="py-12">
    <div class="max-w-4xl mx-auto px-6">
      <h1 class="text-4xl font-bold mb-10 text-center">YOUR CART</h1>

      <div id="cart-items" class="space-y-6 mb-12"></div>

      <!-- Empty State -->
      <div id="empty-cart" class="hidden text-center py-20">
        <i class="fas fa-shopping-cart text-7xl text-gray-300 mb-6"></i>
        <p class="text-2xl text-gray-500">Your cart is empty</p>
        <a href="products.html" class="mt-6 inline-block px-8 py-4 bg-orange-600 text-white rounded-2xl font-semibold">Browse Snacks</a>
      </div>

      <!-- Order Summary -->
      <div id="cart-summary" class="bg-white rounded-3xl p-8 shadow">
        <div class="flex justify-between py-3 border-b">
          <span class="text-gray-600">Subtotal</span>
          <span id="subtotal" class="font-semibold">₦0</span>
        </div>
        <div class="flex justify-between py-3 border-b">
          <span class="text-gray-600">Delivery Fee</span>
          <span class="font-semibold text-green-600">₦200</span>
        </div>
        <div class="flex justify-between py-4 text-xl font-bold">
          <span>Total</span>
          <span id="total" class="text-orange-600">₦0</span>
        </div>

        <button onclick="proceedToCheckout()" 
                class="w-full mt-8 bg-orange-600 hover:bg-orange-700 text-white py-5 rounded-2xl text-lg font-semibold flex items-center justify-center gap-3">
          Proceed to Checkout →
        </button>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
  <script>
    let cart = JSON.parse(localStorage.getItem('wmpkd-cart')) || [];

    function renderCart() {
      const container = document.getElementById('cart-items');
      const empty = document.getElementById('empty-cart');
      const summary = document.getElementById('cart-summary');

      if (cart.length === 0) {
        empty.classList.remove('hidden');
        summary.classList.add('hidden');
        return;
      }

      empty.classList.add('hidden');
      summary.classList.remove('hidden');

      container.innerHTML = cart.map((item, index) => `
        <div class="bg-white rounded-3xl p-6 flex gap-6 shadow">
          <img src="${item.imageUrl || 'https://via.placeholder.com/150'}" 
               alt="${item.name}" 
               class="w-28 h-28 object-cover rounded-2xl">
          <div class="flex-1">
            <h3 class="font-semibold text-xl">${item.name}</h3>
            <p class="text-orange-600 font-bold text-2xl">₦${item.price}</p>
            
            <div class="flex items-center gap-4 mt-4">
              <button onclick="changeQuantity(${index}, -1)" class="w-9 h-9 flex items-center justify-center border rounded-xl hover:bg-gray-100">-</button>
              <span class="font-semibold text-xl w-8 text-center">${item.qty}</span>
              <button onclick="changeQuantity(${index}, 1)" class="w-9 h-9 flex items-center justify-center border rounded-xl hover:bg-gray-100">+</button>
              
              <button onclick="removeFromCart(${index})" 
                      class="ml-auto text-red-500 hover:text-red-600">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');

      updateSummary();
    }

    function updateSummary() {
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('subtotal').textContent = `₦${subtotal}`;
      document.getElementById('total').textContent = `₦${subtotal + 200}`;
    }

    function changeQuantity(index, change) {
      cart[index].qty += change;
      if (cart[index].qty < 1) cart[index].qty = 1;
      localStorage.setItem('wmpkd-cart', JSON.stringify(cart));
      renderCart();
      updateCartCount();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('wmpkd-cart', JSON.stringify(cart));
      renderCart();
      updateCartCount();
    }

    function proceedToCheckout() {
      if (cart.length === 0) return;
      window.location.href = 'checkout.html';
    }

    // Initialize
    renderCart();
    updateCartCount();
  </script>
</body>
</html>
