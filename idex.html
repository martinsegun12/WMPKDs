<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WMPKD - Crunchy Goodness Made for You</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-[#f8f1e3] text-gray-900">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="text-3xl font-bold text-orange-600 tracking-tight">WMPKD</div>
      </div>
      <div class="hidden md:flex gap-8 text-lg font-medium">
        <a href="index.html" class="hover:text-orange-600">Home</a>
        <a href="about.html" class="hover:text-orange-600">About</a>
        <a href="products.html" class="hover:text-orange-600">Products</a>
        <a href="cart.html" class="hover:text-orange-600 flex items-center gap-1">
          Cart <span id="cart-count" class="bg-orange-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
        </a>
        <a href="contact.html" class="hover:text-orange-600">Contact</a>
      </div>
      <a href="cart.html" class="md:hidden text-2xl"><i class="fas fa-shopping-cart"></i></a>
    </div>
  </nav>

  <!-- Hero Section - Your Image -->
  <section class="relative h-screen flex items-center text-white overflow-hidden">
    <img src="https://i.ibb.co/Fk1zTNPS/5-B32-CC1-A-7-B2-F-4283-B22-B-F90-FADE6-F21-B.jpg" 
         alt="Fresh Handmade Chin Chin - WMPKD" 
         class="absolute inset-0 w-full h-full object-cover">
    
    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-black/60 to-black/80"></div>
    
    <div class="relative max-w-5xl mx-auto px-6 text-center z-10">
      <h1 class="text-5xl md:text-7xl font-bold tracking-tighter mb-6 leading-tight">
        CRUNCHY GOODNESS,<br>MADE FOR YOU!
      </h1>
      <p class="text-xl md:text-2xl mb-10 max-w-2xl mx-auto">
        Delicious handmade snacks from Benin City • Fresh to UNIBEN students
      </p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="products.html" 
           class="px-10 py-5 bg-orange-600 hover:bg-orange-700 rounded-2xl text-lg font-semibold transition shadow-lg">
          Shop Now →
        </a>
        <a href="about.html" 
           class="px-10 py-5 border-2 border-white hover:bg-white/10 rounded-2xl text-lg font-semibold transition">
          About Us
        </a>
      </div>
    </div>
  </section>

  <!-- Trust Badges -->
  <section class="py-12 bg-white border-b">
    <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-3 gap-8 text-center">
      <div class="flex items-center justify-center gap-4">
        <i class="fas fa-leaf text-4xl text-orange-600"></i>
        <div><p class="font-semibold">Premium Ingredients</p><p class="text-sm text-gray-600">Fresh & Local</p></div>
      </div>
      <div class="flex items-center justify-center gap-4">
        <i class="fas fa-heart text-4xl text-orange-600"></i>
        <div><p class="font-semibold">Handmade with Love</p><p class="text-sm text-gray-600">By WMPKD</p></div>
      </div>
      <div class="flex items-center justify-center gap-4">
        <i class="fas fa-truck text-4xl text-orange-600"></i>
        <div><p class="font-semibold">Fast Delivery</p><p class="text-sm text-gray-600">UNIBEN Campus</p></div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
