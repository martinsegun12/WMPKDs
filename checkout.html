<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout - WMPKD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> 
    body { font-family: 'Inter', system-ui, sans-serif; } 
  </style>
</head>
<body class="bg-[#f8f1e3] text-gray-900">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="text-3xl font-bold text-orange-600">WMPKD</div>
      <div class="hidden md:flex gap-8 text-lg font-medium">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span id="cart-count" class="bg-orange-600 text-white text-xs px-2 py-0.5 rounded-full">0</span></a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <section class="py-12">
    <div class="max-w-4xl mx-auto px-6">
      <h1 class="text-4xl font-bold mb-10 text-center">Checkout</h1>

      <div class="grid md:grid-cols-2 gap-10">
        <!-- Order Summary -->
        <div>
          <h2 class="text-2xl font-semibold mb-6">Order Summary</h2>
          <div id="checkout-items" class="space-y-6 mb-8"></div>
          
          <div class="bg-white rounded-3xl p-6">
            <div class="flex justify-between py-3">
              <span>Subtotal</span>
              <span id="checkout-subtotal">₦0</span>
            </div>
            <div class="flex justify-between py-3">
              <span>Delivery Fee</span>
              <span class="text-green-600">₦200</span>
            </div>
            <div class="flex justify-between py-4 text-xl font-bold border-t">
              <span>Total</span>
              <span id="checkout-total" class="text-orange-600">₦0</span>
            </div>
          </div>
        </div>

        <!-- Delivery & Contact Form -->
        <div>
          <h2 class="text-2xl font-semibold mb-6">Delivery Details</h2>
          <form id="checkout-form" class="space-y-6 bg-white p-8 rounded-3xl shadow">
            <div>
              <label class="block text-sm font-medium mb-2">Full Name</label>
              <input type="text" id="name" required class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-orange-500">
            </div>
            
            <div>
              <label class="block text-sm font-medium mb-2">Phone Number</label>
              <input type="tel" id="phone" value="+234" required class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-orange-500">
            </div>
            
            <div>
              <label class="block text-sm font-medium mb-2">Delivery Location (UNIBEN / Benin City)</label>
              <textarea id="address" rows="3" required placeholder="Hostel name, landmark, or exact address" 
                        class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-orange-500"></textarea>
            </div>

            <button onclick="sendOrderToWhatsApp(event)" 
                    class="w-full bg-orange-600 hover:bg-orange-700 text-white py-5 rounded-2xl text-lg font-semibold flex items-center justify-center gap-3">
              <i class="fas fa-whatsapp text-2xl"></i>
              Send Order via WhatsApp
            </button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
  <script>
    let cart = JSON.parse(localStorage.getItem('wmpkd-cart')) || [];

    function renderCheckoutItems() {
      const container = document.getElementById('checkout-items');
      container.innerHTML = cart.map(item => `
        <div class="flex gap-4">
          <img src="${item.imageUrl || 'https://via.placeholder.com/80'}" class="w-20 h-20 object-cover rounded-2xl">
          <div class="flex-1">
            <p class="font-medium">${item.name} × ${item.qty}</p>
            <p class="text-orange-600">₦${item.price * item.qty}</p>
          </div>
        </div>
      `).join('');

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('checkout-subtotal').textContent = `₦${subtotal}`;
      document.getElementById('checkout-total').textContent = `₦${subtotal + 200}`;
    }

    function sendOrderToWhatsApp(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const address = document.getElementById('address').value;

      if (!name || !address) {
        alert("Please fill in all fields");
        return;
      }

      let message = `*New Order from WMPKD*\n\n`;
      message += `👤 Name: ${name}\n`;
      message += `📱 Phone: ${phone}\n`;
      message += `📍 Address: ${address}\n\n`;
      message += `🛒 *Items:*\n`;

      cart.forEach(item => {
        message += `• ${item.name} × \( {item.qty} = ₦ \){item.price * item.qty}\n`;
      });

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      message += `\nSubtotal: ₦${subtotal}`;
      message += `\nDelivery: ₦200`;
      message += `\n*Total: ₦${subtotal + 200}*`;

      const whatsappUrl = `https://wa.me/2349043268478?text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, '_blank');

      // Optional: Clear cart after sending
      // localStorage.removeItem('wmpkd-cart');
    }

    // Initialize
    if (cart.length === 0) {
      window.location.href = 'cart.html';
    } else {
      renderCheckoutItems();
      updateCartCount();
    }
  </script>
</body>
</html>
